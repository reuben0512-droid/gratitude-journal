<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grateful">
<meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Grateful</title>
<style>
  :root {
    --bg: #F6F3EE;
    --card: #FFFFFF;
    --ink: #1F1D1A;
    --muted: #8A847B;
    --line: #E7E2DA;
    --accent: #B4694A;
    --accent-soft: #F1E2DA;
    --serif: ui-serif, "New York", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --card: #211F1C;
      --ink: #F1EDE6;
      --muted: #8F887E;
      --line: #2F2C28;
      --accent: #D98B69;
      --accent-soft: #3A2A22;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body {
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 96px);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; }
  .view { display: none; animation: fade .25s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Header */
  .back { background: none; border: 0; color: var(--accent); font: 500 16px var(--sans); padding: 8px 0; margin-bottom: 4px; cursor: pointer; }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 4px; }
  h1 { font: 600 34px/1.15 var(--serif); margin: 0 0 28px; letter-spacing: -.01em; }
  h2 { font: 600 13px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }

  /* Editor */
  .section { margin-bottom: 32px; }
  .gratitude { background: var(--card); border-radius: 18px; padding: 4px 16px; }
  .row { display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .num { font: 600 17px/1 var(--serif); color: var(--accent); padding-top: 17px; width: 14px; flex: none; }
  textarea {
    width: 100%; border: 0; background: transparent; color: var(--ink); resize: none;
    font: 17px/1.45 var(--sans); padding: 14px 0; outline: none; overflow: hidden;
  }
  textarea::placeholder { color: var(--muted); opacity: .7; }
  .thoughts { background: var(--card); border-radius: 18px; padding: 2px 16px; }
  .thoughts textarea { min-height: 140px; }
  .saved { text-align: center; font-size: 13px; color: var(--muted); opacity: 0; transition: opacity .4s; height: 16px; }
  .saved.show { opacity: 1; }

  /* On this day */
  .memory { background: var(--accent-soft); border-radius: 18px; padding: 16px; cursor: pointer; }
  .memory h2 { color: var(--accent); margin-bottom: 8px; }

  /* Calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head h1 { margin: 0; font-size: 28px; }
  .arrows button { background: var(--card); border: 0; color: var(--ink); width: 38px; height: 38px; border-radius: 50%; font-size: 18px; margin-left: 6px; cursor: pointer; }
  .arrows button:disabled { opacity: .3; }
  .cal { background: var(--card); border-radius: 18px; padding: 12px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 28px; }
  .dow { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0 8px; font-weight: 600; }
  .day { aspect-ratio: 1; border: 0; background: none; color: var(--ink); font: 15px var(--sans); border-radius: 50%; position: relative; cursor: pointer; padding: 0; }
  .day.has { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .day:disabled { color: var(--muted); opacity: .35; cursor: default; }

  /* Entry cards */
  .card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
  .card .date { font: 600 17px var(--serif); margin-bottom: 8px; }
  .card ol { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.5; }
  .card ol li::marker { color: var(--accent); }
  .card .t { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 15px; }

  /* Backup */
  .backup { display: flex; gap: 10px; margin-top: 36px; }
  .backup button, .backup label { flex: 1; text-align: center; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 12px; padding: 12px; font: 500 14px var(--sans); cursor: pointer; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.4; }

  /* Tab bar */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 10px);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  nav button { flex: 1; max-width: 180px; border: 0; background: none; color: var(--muted); font: 600 15px var(--sans); padding: 10px; border-radius: 12px; cursor: pointer; }
  nav button.active { background: var(--card); color: var(--ink); }
</style>
</head>
<body>
<main>
  <!-- Write -->
  <section id="view-write" class="view active">
    <button id="back" class="back" hidden>‹ Past entries</button>
    <div class="eyebrow" id="w-eyebrow"></div>
    <h1 id="w-title"></h1>

    <div class="section">
      <h2>Three things I'm grateful for</h2>
      <div class="gratitude">
        <div class="row"><span class="num">1</span><textarea rows="1" data-g="0" placeholder="Something small counts"></textarea></div>
        <div class="row"><span class="num">2</span><textarea rows="1" data-g="1" placeholder="Someone who helped"></textarea></div>
        <div class="row"><span class="num">3</span><textarea rows="1" data-g="2" placeholder="A moment worth keeping"></textarea></div>
      </div>
    </div>

    <div class="section">
      <h2>Thoughts of the day</h2>
      <div class="thoughts"><textarea id="thoughts" placeholder="What did you notice today?"></textarea></div>
    </div>

    <div class="saved" id="saved">Saved</div>

    <div class="section" id="memory-wrap" hidden>
      <div class="memory" id="memory"></div>
    </div>
  </section>

  <!-- Past -->
  <section id="view-past" class="view">
    <div class="cal-head" style="margin-top:16px">
      <h1 id="month-title"></h1>
      <div class="arrows"><button id="prev" aria-label="Previous month">‹</button><button id="next" aria-label="Next month">›</button></div>
    </div>
    <div class="cal" id="cal"></div>
    <div id="list"></div>

    <div class="backup">
      <button id="export">Back up</button>
      <label>Restore<input type="file" id="import" accept="application/json,.json" hidden></label>
    </div>
    <p class="note">Your entries live only on this phone. Back up now and then to keep a copy in Files.</p>
  </section>
</main>

<nav>
  <button data-tab="write" class="active">Today</button>
  <button data-tab="past">Past</button>
</nav>

<script>
const KEY = 'gj.entries.v1';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => keyOf(new Date());
const fmt = (d, o) => d.toLocaleDateString('en-AU', o);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let entries = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
const persist = () => localStorage.setItem(KEY, JSON.stringify(entries));
if (navigator.storage?.persist) navigator.storage.persist();

let editing = todayKey();
let shownMonth = new Date(); shownMonth.setDate(1);

/* ---------- Write view ---------- */
const gInputs = [...document.querySelectorAll('[data-g]')];
const thoughts = $('#thoughts');
const grow = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };

function renderWrite() {
  const d = fromKey(editing), isToday = editing === todayKey();
  $('#back').hidden = isToday;
  $('#w-eyebrow').textContent = isToday ? fmt(d, { day: 'numeric', month: 'long', year: 'numeric' }) : fmt(d, { weekday: 'long' });
  $('#w-title').textContent = isToday ? 'Today' : fmt(d, { day: 'numeric', month: 'long', year: 'numeric' });
  const e = entries[editing] || { g: ['', '', ''], t: '' };
  gInputs.forEach((t, i) => t.value = e.g[i] || '');
  thoughts.value = e.t || '';
  [...gInputs, thoughts].forEach(grow);
  renderMemory(isToday);
}

let savedTimer;
function save() {
  const g = gInputs.map(t => t.value), t = thoughts.value;
  if (g.every(x => !x.trim()) && !t.trim()) delete entries[editing];
  else entries[editing] = { g, t, updated: Date.now() };
  persist();
  const s = $('#saved'); s.classList.add('show');
  clearTimeout(savedTimer); savedTimer = setTimeout(() => s.classList.remove('show'), 1200);
}
[...gInputs, thoughts].forEach(t => t.addEventListener('input', () => { grow(t); save(); }));

function renderMemory(isToday) {
  const wrap = $('#memory-wrap');
  wrap.hidden = true;
  if (!isToday) return;
  const now = new Date();
  for (let y = 1; y <= 10; y++) {
    const k = keyOf(new Date(now.getFullYear() - y, now.getMonth(), now.getDate()));
    const e = entries[k];
    if (!e) continue;
    const items = e.g.filter(x => x.trim());
    $('#memory').innerHTML = `<h2>${y === 1 ? 'One year ago today' : y + ' years ago today'}</h2>`
      + (items.length ? `<div style="font-size:15px;line-height:1.5">${items.map(esc).join(' · ')}</div>` : '')
      + (e.t?.trim() ? `<div style="font-size:14px;color:var(--muted);margin-top:6px">${esc(e.t.slice(0, 140))}${e.t.length > 140 ? '…' : ''}</div>` : '');
    $('#memory').onclick = () => openEntry(k);
    wrap.hidden = false;
    return;
  }
}

function openEntry(k) { editing = k; show('write', false); }
$('#back').onclick = () => show('past');

/* ---------- Past view ---------- */
function renderPast() {
  const y = shownMonth.getFullYear(), m = shownMonth.getMonth();
  $('#month-title').textContent = fmt(shownMonth, { month: 'long', year: 'numeric' });
  const now = new Date();
  $('#next').disabled = y === now.getFullYear() && m === now.getMonth();

  const cal = $('#cal'); cal.innerHTML = '';
  ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach(d => cal.insertAdjacentHTML('beforeend', `<div class="dow">${d}</div>`));
  const offset = (new Date(y, m, 1).getDay() + 6) % 7; // Monday first
  for (let i = 0; i < offset; i++) cal.insertAdjacentHTML('beforeend', '<div></div>');
  const days = new Date(y, m + 1, 0).getDate(), tk = todayKey();
  for (let d = 1; d <= days; d++) {
    const date = new Date(y, m, d), k = keyOf(date);
    const b = document.createElement('button');
    b.className = 'day' + (entries[k] ? ' has' : '') + (k === tk ? ' today' : '');
    b.textContent = d;
    b.disabled = date > now;
    b.onclick = () => openEntry(k);
    cal.appendChild(b);
  }

  const prefix = `${y}-${pad(m + 1)}-`;
  const keys = Object.keys(entries).filter(k => k.startsWith(prefix)).sort().reverse();
  $('#list').innerHTML = keys.length ? '' : '<div class="empty">No entries this month yet.</div>';
  keys.forEach(k => {
    const e = entries[k], items = e.g.filter(x => x.trim());
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="date">${fmt(fromKey(k), { weekday: 'long', day: 'numeric', month: 'long' })}</div>`
      + (items.length ? `<ol>${items.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : '')
      + (e.t?.trim() ? `<div class="t">${esc(e.t)}</div>` : '');
    c.onclick = () => openEntry(k);
    $('#list').appendChild(c);
  });
}
$('#prev').onclick = () => { shownMonth.setMonth(shownMonth.getMonth() - 1); renderPast(); };
$('#next').onclick = () => { shownMonth.setMonth(shownMonth.getMonth() + 1); renderPast(); };

/* ---------- Backup ---------- */
$('#export').onclick = async () => {
  const name = `gratitude-backup-${todayKey()}.json`;
  const file = new File([JSON.stringify(entries, null, 2)], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {}
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name; a.click();
  }
};
$('#import').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    for (const [k, e] of Object.entries(data)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(e?.g)) continue;
      if (!entries[k] || (e.updated || 0) > (entries[k].updated || 0)) entries[k] = e;
    }
    persist(); renderPast();
  } catch { /* ignore bad file */ }
  ev.target.value = '';
};

/* ---------- Tabs ---------- */
function show(tab, resetToToday = true) {
  if (tab === 'write' && resetToToday) editing = todayKey();
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === (tab === 'write' && editing === todayKey() ? 'write' : tab === 'write' ? 'past' : tab)));
  tab === 'write' ? renderWrite() : renderPast();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  if (b.dataset.tab === 'past') { shownMonth = new Date(); shownMonth.setDate(1); }
  show(b.dataset.tab);
});

// If the app was left open overnight, roll "Today" over to the new day.
let lastDay = todayKey();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && todayKey() !== lastDay) {
    if (editing === lastDay) editing = todayKey();
    lastDay = todayKey();
    $('#view-write').classList.contains('active') ? renderWrite() : renderPast();
  }
});

renderWrite();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
